name: Continuous Integration (CI)

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unit-tests-and-build:
    name: Unit Tests & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci_dummy_gemini_key' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci_dummy_anon_key' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run Domain & Shared Unit Tests
        run: ./gradlew :shared:testDebugUnitTest --no-daemon --stacktrace

      - name: Publish Test Report to GitHub PR Checks
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: '🧪 Unit Test Results (Domain & Shared)'
          fail_on_failure: true
          require_tests: true
          detailed_summary: true

      - name: Verify Android App Build (assembleDebug)
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-html-reports
          path: |
            shared/build/reports/tests/testDebugUnitTest/
            androidApp/build/reports/tests/
          retention-days: 7
