name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-build:
    name: Unit Tests & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run Domain & Shared Unit Tests
        run: ./gradlew :shared:testDebugUnitTest --no-daemon --stacktrace

      - name: Verify Android App Build (assembleDebug)
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            shared/build/reports/tests/testDebugUnitTest/
            androidApp/build/reports/tests/
          retention-days: 7
